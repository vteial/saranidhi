<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    Saranidhi Logo — Lotus Flame (Direction B)
    
    Concept: A bold lotus bloom with a central upward flame
    representing the breath rising through Sushumna. Deep purple
    to gold warm gradient. The flame is the focal point — life force.
    The lotus petals cradle it. Simple, spiritual, modern.
  -->

  <defs>
    <linearGradient id="lfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0536"/>
      <stop offset="50%" stop-color="#2d1054"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="lfFlameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="40%" stop-color="#FFB347"/>
      <stop offset="75%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFFACD"/>
    </linearGradient>
    <linearGradient id="lfPetalGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7B2FBE"/>
      <stop offset="50%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#D4A5FF"/>
    </linearGradient>
    <linearGradient id="lfPetalGrad2" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5B2D8E"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#lfBgGrad)"/>
  
  <!-- Subtle outer glow ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="#D4A5FF" stroke-width="2" opacity="0.2"/>

  <!-- Back petals (larger, darker) -->
  <path
    d="M 256 310
       C 220 300, 160 270, 140 230
       C 155 260, 190 290, 230 305Z"
    fill="url(#lfPetalGrad2)"
    opacity="0.7"
  />
  <path
    d="M 256 310
       C 292 300, 352 270, 372 230
       C 357 260, 322 290, 282 305Z"
    fill="url(#lfPetalGrad2)"
    opacity="0.7"
  />

  <!-- Outer petals (left) -->
  <path
    d="M 256 320
       C 230 310, 175 285, 155 245
       C 165 275, 200 305, 240 318Z"
    fill="url(#lfPetalGrad)"
    opacity="0.85"
  />
  <!-- Outer petals (right) -->
  <path
    d="M 256 320
       C 282 310, 337 285, 357 245
       C 347 275, 312 305, 272 318Z"
    fill="url(#lfPetalGrad)"
    opacity="0.85"
  />

  <!-- Inner petals (left) -->
  <path
    d="M 256 310
       C 240 300, 200 275, 185 240
       C 195 265, 220 290, 248 307Z"
    fill="url(#lfPetalGrad)"
  />
  <!-- Inner petals (right) -->
  <path
    d="M 256 310
       C 272 300, 312 275, 327 240
       C 317 265, 292 290, 264 307Z"
    fill="url(#lfPetalGrad)"
  />

  <!-- Center petals (flanking flame) -->
  <path
    d="M 256 295
       C 244 285, 220 260, 215 225
       C 225 250, 240 275, 252 292Z"
    fill="#B57EDC"
    opacity="0.9"
  />
  <path
    d="M 256 295
       C 268 285, 292 260, 297 225
       C 287 250, 272 275, 260 292Z"
    fill="#B57EDC"
    opacity="0.9"
  />

  <!-- Main flame (central) -->
  <path
    d="M 256 310
       C 245 280, 230 250, 235 215
       C 238 190, 248 165, 256 140
       C 264 165, 274 190, 277 215
       C 282 250, 267 280, 256 310Z"
    fill="url(#lfFlameGrad)"
  />

  <!-- Inner flame (brighter core) -->
  <path
    d="M 256 300
       C 250 275, 242 250, 245 225
       C 247 205, 253 180, 256 160
       C 259 180, 265 205, 267 225
       C 270 250, 262 275, 256 300Z"
    fill="#FFFACD"
    opacity="0.6"
  />

  <!-- Flame tip spark -->
  <circle cx="256" cy="138" r="5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Base platform (lotus seat) -->
  <ellipse cx="256" cy="340" rx="70" ry="12" fill="#5B2D8E" opacity="0.5"/>

  <!-- Cosmic dots -->
  <circle cx="145" cy="145" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="370" cy="130" r="2.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="110" cy="350" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="400" cy="360" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="180" cy="420" r="1.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="340" cy="430" r="2" fill="#FFFFFF" opacity="0.35"/>
</svg>
