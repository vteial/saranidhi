<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    Saranidhi Logo — "The Treasure House of Breath"
    Direction A: Golden Bird + Breath curve on deep indigo background
    
    Concept: A stylized bird (Pakshi) in gold, mid-flight with wings
    spread as breath curves. Set on a rich indigo-to-purple gradient
    circle. A subtle breath spiral flows through the bird's body,
    connecting earth to sky. Bold, vibrant, recognizable at any size.
  -->

  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="birdGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E8890C"/>
    </linearGradient>
    <linearGradient id="breathGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5BEAD6"/>
      <stop offset="100%" stop-color="#7B68EE"/>
    </linearGradient>
  </defs>

  <!-- Solid background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.3"/>

  <!-- Breath curve (flowing S-curve through center) -->
  <path
    d="M 256 420
       C 220 380, 180 330, 200 280
       C 220 230, 290 230, 310 280
       C 330 330, 290 380, 256 420"
    stroke="url(#breathGrad)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />
  <path
    d="M 256 100
       C 290 140, 330 190, 310 240
       C 290 290, 220 290, 200 240
       C 180 190, 220 140, 256 100"
    stroke="url(#breathGrad)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />

  <!-- Bird body — stylized swift/peacock in flight -->
  <!-- Main body -->
  <path
    d="M 256 200
       C 270 195, 285 200, 290 215
       C 295 230, 285 245, 270 250
       L 256 255
       L 242 250
       C 227 245, 217 230, 222 215
       C 227 200, 242 195, 256 200Z"
    fill="url(#birdGrad)"
  />

  <!-- Left wing (spread wide) -->
  <path
    d="M 242 230
       C 220 220, 170 200, 130 175
       C 150 195, 175 215, 200 235
       C 210 240, 225 240, 235 237Z"
    fill="url(#birdGrad)"
  />

  <!-- Right wing (spread wide) -->
  <path
    d="M 270 230
       C 292 220, 342 200, 382 175
       C 362 195, 337 215, 312 235
       C 302 240, 287 240, 277 237Z"
    fill="url(#birdGrad)"
  />

  <!-- Tail feathers (flowing down) -->
  <path
    d="M 256 255
       C 250 275, 240 300, 235 330
       C 245 320, 255 310, 256 300
       C 257 310, 267 320, 277 330
       C 272 300, 262 275, 256 255Z"
    fill="url(#birdGrad)"
    opacity="0.9"
  />

  <!-- Head -->
  <circle cx="256" cy="188" r="16" fill="url(#birdGrad)"/>
  
  <!-- Eye -->
  <circle cx="256" cy="186" r="4" fill="#1a0533"/>

  <!-- Crown crest (3 small feathers) -->
  <path
    d="M 252 174 L 250 160 L 254 170Z"
    fill="#FFD700"
  />
  <path
    d="M 256 172 L 256 155 L 258 170Z"
    fill="#FFD700"
  />
  <path
    d="M 260 174 L 262 160 L 258 170Z"
    fill="#FFD700"
  />

  <!-- Bindu (cosmic dot above bird) -->
  <circle cx="256" cy="130" r="6" fill="#5BEAD6" opacity="0.9"/>
  
  <!-- Small stars/dots for cosmic feel -->
  <circle cx="160" cy="140" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="355" cy="130" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="130" cy="300" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="385" cy="310" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="180" cy="390" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="340" cy="400" r="2" fill="#FFFFFF" opacity="0.4"/>
</svg>
