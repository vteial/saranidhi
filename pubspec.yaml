name: saranidhi
description: "The Treasure House of Breath — A spiritual life-guidance app rooted in ancient Sara Kalai science."
publish_to: 'none'
version: 1.4.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management — Riverpod 3 with code generation
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.2.3

  # Local Database
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0
  drift_flutter: ^0.3.0

  # Models & Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # File sharing & picking
  share_plus: ^10.1.4
  file_picker: ^8.3.7

  # App info & linking
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

  # Local Notifications (iOS, macOS, Android)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^7.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.2
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ^2.34.0

  # Testing
  mocktail: ^1.0.4

# Pin sqlparser to 0.44.5 — version 0.44.6 (released 2026-07-06) removed
# the .when() method on DartPlaceholder that drift_dev 2.34.0 depends on.
# This is a transient upstream issue; remove once drift_dev publishes a fix.
dependency_overrides:
  sqlparser: 0.44.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - public/logo.svg
