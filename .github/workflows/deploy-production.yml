name: Deploy to Production (Cloudflare Pages)

# Triggered manually or on push to prod branch
on:
  push:
    branches: [prod]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.kiro/**'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate: require explicit confirmation for manual triggers
  confirm:
    name: Confirm Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm_deploy == 'deploy'
    steps:
      - name: Deployment confirmed
        run: echo "Production deployment confirmed."

  build:
    name: Build Flutter Web (Release)
    runs-on: ubuntu-latest
    needs: confirm

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release --web-renderer canvaskit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=saranidhi --branch=production

  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Verify deployment is live
        run: |
          # Check that the site responds with 200
          DEPLOY_URL="https://saranidhi.pages.dev"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$DEPLOY_URL")
          echo "Deployment URL: $DEPLOY_URL"
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Production deployment verified!"
          else
            echo "⚠️ Deployment returned status $STATUS — may need manual verification"
          fi

      - name: Verify privacy policy accessible
        run: |
          PRIVACY_URL="https://saranidhi.pages.dev/privacy.html"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$PRIVACY_URL")
          echo "Privacy Policy URL: $PRIVACY_URL"
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Privacy policy page accessible!"
          else
            echo "⚠️ Privacy policy returned status $STATUS"
          fi
