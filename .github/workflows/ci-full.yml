name: CI (Full)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.kiro/**'
  pull_request:
    branches: [main, prod]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.kiro/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  full-test-suite:
    name: Full Test Suite + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: "Run ALL tests (Tier 1 + Tier 2) with coverage"
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage file found!"
            exit 1
          fi

          TOTAL_LINES=$(grep -c "^DA:" coverage/lcov.info || echo "0")
          HIT_LINES=$(grep "^DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo "0")

          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "No coverage data found."
            exit 1
          fi

          COVERAGE=$(( HIT_LINES * 100 / TOTAL_LINES ))
          echo "Coverage: $COVERAGE% ($HIT_LINES/$TOTAL_LINES lines hit)"

          # Threshold re-raised 18% -> 19% in Sprint 36 (Task 36.5): the
          # Sprint 35 somatic UI (timer room, pacer, cross-lateral card,
          # selector) and its repository now have dedicated unit/widget tests,
          # restoring the line-coverage ratio that was temporarily diluted for
          # v1.5.0. Broader UI/E2E coverage remains owed to the dedicated
          # Sprint E2E (Playwright repo).
          THRESHOLD=19
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "Coverage $COVERAGE% is below the ${THRESHOLD}% threshold!"
            exit 1
          else
            echo "Coverage $COVERAGE% meets the ${THRESHOLD}% threshold."
          fi

      - name: Build web
        run: flutter build web

  integration-test:
    name: Integration Tests (Web)
    runs-on: ubuntu-latest
    needs: full-test-suite
    # Blocking gate again as of Sprint 36 (Task 36.1): the ChromeDriver
    # ConnectionClosedException flake was fixed with a bounded readiness poll,
    # and the app_test.dart assertions now target stable shell UI, so these
    # in-repo web integration tests are a trustworthy gate.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run integration tests (web)
        run: |
          if [ -d "integration_test" ] && [ "$(find integration_test -name '*_test.dart' | wc -l)" -gt 0 ]; then
            chromedriver --port=4444 &
            # Wait for ChromeDriver to be ready before running flutter drive.
            # A bare `sleep 2` raced startup and caused ConnectionClosedException;
            # poll the /status endpoint (bounded to ~30s) until it responds.
            for i in $(seq 1 30); do
              if curl -sf http://localhost:4444/status >/dev/null 2>&1; then
                echo "ChromeDriver ready after ${i}s."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ChromeDriver did not become ready within 30s."
                exit 1
              fi
              sleep 1
            done
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_test.dart \
              -d web-server \
              --browser-name=chrome \
              --headless
          else
            echo "No integration tests found yet — skipping."
          fi
