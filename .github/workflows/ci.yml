name: CI (Fast)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.kiro/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-test-build:
    name: Analyze, Fast Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: "Run Tier 1 tests (domain + providers)"
        run: |
          flutter test \
            test/features/astro_engine/ \
            test/features/breath_journal/ \
            test/features/cloud_backup/ \
            test/features/streaks/ \
            test/features/ai_wisdom/ \
            test/features/notifications/ \
            test/features/onboarding/ \
            test/features/providers/

      - name: Build web
        run: flutter build web
